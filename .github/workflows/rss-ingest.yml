name: Future Sphere RSS ingestion

on:
  schedule:
    # Run automatically every 15 minutes.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      max_items:
        description: "Maximum new articles to process in this manual run (1–15)"
        required: false
        default: "10"
        type: string
  push:
    branches:
      - main
    paths:
      - "scripts/ingest-rss.mjs"
      - ".github/workflows/rss-ingest.yml"

permissions:
  contents: read

concurrency:
  group: future-sphere-rss-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Import, translate and publish RSS items
        run: npm run rss:ingest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
          MAX_AI_ITEMS_PER_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.max_items || '3' }}
